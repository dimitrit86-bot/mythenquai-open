name: Verify Kompass product import sources
on:
  push:
    branches: [kompass-import-celebration-v14]
    paths: [.github/workflows/kompass-import-v14.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect requested public product page
        run: |
          mkdir -p source-check
          python3 - <<'PY'
          import urllib.request,json
          from pathlib import Path
          u='https://www.coop.ch/de/lebensmittel/fleisch-fisch/the-veggie-chef/steaks-filets/redefine-vegane-alternative-zu-flank-steak/p/7451865'
          req=urllib.request.Request(u,headers={'User-Agent':'Naehrstoff-Kompass/1.4 (+https://github.com/dimitrit86-bot/mythenquai-open)','Accept':'text/html','Accept-Language':'de-CH,de;q=0.9'})
          with urllib.request.urlopen(req,timeout=30) as r:
            b=r.read(4000000)
            Path('source-check/coop.html').write_bytes(b)
            Path('source-check/response.json').write_text(json.dumps({'status':r.status,'url':r.url,'bytes':len(b),'type':r.headers.get('Content-Type')},indent=2))
            print('Public source',r.status,'bytes',len(b))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompass-public-product-source
          path: source-check/
          retention-days: 1
