name: Read public USDA household-measure reference data
on:
  push:
    branches: [kompass-reference-measures-v111]
    paths: [.github/workflows/kompass-measure-sources.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read official SR Legacy household weights only
        run: |
          mkdir -p references
          python3 - <<'PY'
          import urllib.request,zipfile,io,csv,json,hashlib
          from pathlib import Path
          url='https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Naehrstoff-Kompass reference validation'}),timeout=60) as r: data=r.read(20000000)
          z=zipfile.ZipFile(io.BytesIO(data))
          def read(name):
            file=next(n for n in z.namelist() if n.split('/')[-1]==name)
            return list(csv.DictReader(io.TextIOWrapper(z.open(file),encoding='utf-8-sig')))
          foods=read('food.csv');portions=read('food_portion.csv');legacy=read('sr_legacy_food.csv')
          wanted=['onions, raw','peppers, sweet, red, raw','peppers, sweet, green, raw','carrots, raw','tomatoes, red, ripe, raw','squash, summer, zucchini','cucumber, with peel, raw','garlic, raw','mushrooms, white, raw','spinach, raw','broccoli, raw','cauliflower, raw','potatoes, flesh and skin, raw','egg, whole, raw, fresh','bananas, raw','apples, raw, with skin','wheat flour, white, all-purpose, unenriched','oats','rice, white, long-grain','rice, brown, long-grain','lentils, mature seeds','chickpeas (garbanzo beans, bengal gram)','sugars, granulated','oil, olive, salad or cooking','water, tap','honey','butter, without salt','nuts, almonds','quinoa']
          selection=[f for f in foods if any(f['description'].lower().startswith(w) for w in wanted)]
          ids={f['fdc_id'] for f in selection};meta={r['fdc_id']:r for r in legacy if r['fdc_id'] in ids}
          result=[]
          for f in selection:
            result.append({'food':f,'legacy':meta.get(f['fdc_id']),'portions':[p for p in portions if p['fdc_id']==f['fdc_id']]})
          Path('references/usda-measures.json').write_text(json.dumps({'source':url,'archiveSha256':hashlib.sha256(data).hexdigest(),'license':'Public domain / CC0 USDA FoodData Central','foods':result},ensure_ascii=False,indent=2))
          print('Reference foods:',len(result),'portions:',sum(len(r['portions']) for r in result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kompass-usda-measures
          path: references/
          retention-days: 7
