name: Verify linked nutrition corrections
on:
  push:
    branches: [kompass-nutrition-corrections-v113]
    paths: [tools/nk113/**, tools/apply_nk113.py, tools/recalc_followup.py, .github/workflows/kompass-nutrition-v113.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed correction sources
        run: |
          python3 tools/apply_nk113.py
          python3 tools/recalc_followup.py
      - name: Release notes, syntax and all unit regressions
        run: |
          mkdir -p test-output
          python3 kompass/release-notes/build.py --check
          for f in kompass/*.js; do node --check "$f"; done
          set -o pipefail
          for f in kompass/tests/*.test.js; do node "$f"; done | tee test-output/unit-checks.txt
      - name: Prepare browser engines
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Chromium synthetic household with actual encrypted storage and PDF
        env:
          TEST_BROWSER: chromium
        run: python3 tools/test_recalc_browser.py
      - name: WebKit synthetic household with actual encrypted storage and PDF
        env:
          TEST_BROWSER: webkit
        run: python3 tools/test_recalc_browser.py
      - name: Commit verified sources to review branch only
        run: |
          git config user.name 'Kompass verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kompass/ tools/test_recalc_browser.py
          git diff --cached --quiet || git commit -m 'Verify product corrections with linked recipe diary and report recalculation'
          git push origin HEAD:kompass-nutrition-corrections-v113
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompass-nutrition-corrections-verified
          path: |
            kompass/
            test-output/
            tools/test_recalc_browser.py
          retention-days: 7
