name: Verify Kompass personal macro targets and preset selector
on:
  push:
    branches: [kompass-macro-profiles-v15]
    paths: [tools/nk15/**, tools/apply_nk15.py, tools/nk15_followup.py, .github/workflows/kompass-macros-v15.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed macro goal changes
        run: |
          python3 tools/apply_nk15.py
          if test -f tools/nk15_followup.py; then python3 tools/nk15_followup.py; fi
      - name: Syntax and calculation regressions
        run: |
          for f in kompass/*.js; do node --check "$f"; done
          for f in kompass/tests/*.test.js; do node "$f"; done
      - name: Install test browsers
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Chromium UI with synthetic household and intercepted network
        env:
          TEST_BROWSER: chromium
        run: python3 kompass/tests/macros-browser.py
      - name: WebKit UI with synthetic household and intercepted network
        env:
          TEST_BROWSER: webkit
        run: python3 kompass/tests/macros-browser.py
      - name: Commit tested source on verification branch only
        run: |
          git config user.name 'Kompass verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kompass/
          git diff --cached --quiet || git commit -m 'Verify four nutrition presets, personal macro targets and preserved diaries'
          git push origin HEAD:kompass-macro-profiles-v15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompass-v15-source-and-tests
          path: |
            kompass/
            test-output/
            tools/nk15/
          retention-days: 7
