name: Verify Kompass piece portions and own-product text
on:
  push:
    branches: [kompass-pieces-text-v18]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded source patch
        run: |
          python3 tools/apply_pieces_v18.py
          if test -f tools/pieces_followup.py; then python3 tools/pieces_followup.py; fi
      - name: Syntax and calculation regressions
        run: |
          for f in kompass/*.js; do node --check "$f"; done
          for f in kompass/tests/*.test.js; do node "$f"; done
      - name: Prepare browser engines
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Chromium real UI and PDF with synthetic profiles
        env:
          TEST_BROWSER: chromium
        run: python3 tools/test_pieces_v18.py
      - name: WebKit real UI and PDF with synthetic profiles
        env:
          TEST_BROWSER: webkit
        run: python3 tools/test_pieces_v18.py
      - name: Preserve verified application on review branch only
        run: |
          git config user.name 'Kompass verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kompass/
          git diff --cached --quiet || git commit -m 'Verify piece portions text import and retained reports'
          git push origin HEAD:kompass-pieces-text-v18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompass-v18-source-and-checks
          path: |
            kompass/
            test-output/
          retention-days: 7
