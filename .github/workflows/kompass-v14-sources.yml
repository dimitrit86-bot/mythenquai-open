name: Verify public product import sources
on:
  push:
    branches: [kompass-complete-v14]
    paths: [.github/workflows/kompass-v14-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public Coop page and OFF text-search response
        run: |
          mkdir -p sources
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          from pathlib import Path
          urls={'coop':'https://www.coop.ch/de/lebensmittel/fleisch-fisch/the-veggie-chef/steaks-filets/redefine-vegane-alternative-zu-flank-steak/p/7451865','off':'https://world.openfoodfacts.org/cgi/search.pl?'+urllib.parse.urlencode({'search_terms':'redefine flank steak','search_simple':1,'action':'process','json':1,'page_size':8,'fields':'code,product_name,product_name_de,brands,quantity,nutriments,nutrition_data_per'})}
          report={}
          for name,url in urls.items():
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Naehrstoff-Kompass/1.4 (github.com/dimitrit86-bot/mythenquai-open)','Accept-Language':'de-CH,de;q=0.9'})
              with urllib.request.urlopen(request,timeout=35) as response:
                raw=response.read(5000000);Path('sources/'+name+('.html' if name=='coop' else '.json')).write_bytes(raw);report[name]={'status':response.status,'size':len(raw)}
            except Exception as error:report[name]={'error':str(error)}
          Path('sources/report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kompass-v14-public-sources
          path: sources/
          retention-days: 1
