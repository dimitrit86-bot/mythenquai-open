<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smash the Florian · lädt…</title>
<style>html,body{margin:0;height:100%;background:#101e25;color:#f7faec;font-family:system-ui,sans-serif;display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;border:4px solid #344852;border-top-color:#e0ff87;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#a8bdc4}</style></head>
<body><div class="box"><div class="spin"></div><b>SMASH THE FLORIAN</b><br><small>Offline-Version wird geladen…</small></div>
<script>
(async()=>{
 try{
  const names=['payload1.txt','payload2.txt','payload3.txt','payload4.txt'];
  const parts=await Promise.all(names.map(n=>fetch(n+'?v=16').then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));
  const b64=parts.join('').replace(/\s/g,'');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('Browser unterstützt DecompressionStream nicht');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.body.innerHTML='<div class="box"><b>Laden fehlgeschlagen</b><p>'+String(e.message||e)+'</p><p><a style="color:#e0ff87" href="./">Zurück zur Startseite</a></p></div>';
 }
})();
</script></body></html>
